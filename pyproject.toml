[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terastal-layer-versioning"
version = "0.1.0"
description = "Offline layer-variant experiments for Terastal"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.3,<2.4",
  "torchvision>=0.18,<0.19",
  "numpy>=1.26,<2.1",
  "scipy>=1.11,<1.15",
  "pillow>=9,<11",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
  "thop>=0.1.1",
]

[project.optional-dependencies]
swin = ["transformers==4.44.2"]
ssd = ["opencv-python-headless>=4.8,<4.12", "pandas>=2,<3"]
depth = ["opencv-python-headless>=4.8,<4.12", "pandas>=2,<3", "h5py>=3,<4"]
all = ["transformers==4.44.2", "opencv-python-headless>=4.8,<4.12", "pandas>=2,<3", "h5py>=3,<4"]

[tool.setuptools.packages.find]
include = ["utils*", "experiments*", "vision*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"experiments" = ["*/README.md", "*/exports/*.m", "*/exports/*.txt", "*/voc-model-labels.txt"]
"vision" = ["LICENSE"]
